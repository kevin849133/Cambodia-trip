<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12372F">
<title>柬埔寨 2026/10 一起去旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12372F;--moss:#2F6B4F;--lotus:#D93F7B;--saf:#EF9F2B;--mist:#EEF3EC;--stone:#CFC8B4;--card:#fff;--tx:#1d2b27;--sub:#66736e;--r:16px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:120px}
body{font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--mist);color:var(--tx);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));line-height:1.5}
.hero{position:relative;background:linear-gradient(180deg,#F7C9B6 0%,#F4A7A0 38%,#E0709A 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 0;overflow:hidden}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:27px;line-height:1.2;text-shadow:0 1px 8px rgba(18,55,47,.35)}
.hero p{font-size:13px;margin-top:6px;opacity:.95}
.cd{display:inline-block;margin-top:10px;background:rgba(18,55,47,.82);padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:700}
.hero svg{display:block;width:calc(100% + 40px);margin:6px -20px 0}
.days{position:sticky;top:0;z-index:20;background:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:12px;padding:6px 12px;background:rgba(255,255,255,.1);color:#cfe3d8;font:inherit;font-size:12px;text-align:center;min-width:58px}
.chip b{display:block;font-size:16px;color:#fff}
.chip.on{background:var(--saf);color:var(--ink)}.chip.on b{color:var(--ink)}
main{padding:16px 14px}
.dh{margin:4px 2px 14px}
.dh small{color:var(--lotus);font-weight:700;font-size:13px}
.dh h2{font-family:"Noto Serif TC",serif;font-size:23px;color:var(--ink);line-height:1.25}
.dh .sum{font-size:13px;color:var(--sub);margin-top:4px}
.tl{position:relative;padding-left:4px}
.tl:before{content:"";position:absolute;left:62px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(var(--stone) 0 6px,transparent 6px 11px)}
.it{display:flex;gap:0;margin-bottom:12px;position:relative}
.tm{width:54px;flex:0 0 54px;text-align:right;font-weight:700;font-size:13.5px;color:var(--ink);padding-top:12px;font-variant-numeric:tabular-nums}
.dot{flex:0 0 18px;display:flex;justify-content:center;padding-top:15px;z-index:1}
.dot i{width:12px;height:12px;border-radius:50%;background:var(--moss);border:3px solid var(--mist);box-sizing:content-box}
.it.fly .dot i{background:#3B82C4}.it.food .dot i{background:var(--saf)}.it.night .dot i{background:#6B4FA0}.it.sight .dot i{background:var(--lotus)}.it.move .dot i{background:#8A7B5A}.it.rest .dot i{background:var(--moss)}
.cdd{flex:1;background:var(--card);border-radius:var(--r);padding:11px 13px;box-shadow:0 1px 3px rgba(18,55,47,.12);min-width:0}
.ti{font-weight:700;font-size:15px}
.ti .ic{margin-right:6px}
.nt{font-size:12.5px;color:var(--sub);margin-top:3px;white-space:pre-line}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:#FCE3EC;color:var(--lotus);margin-top:5px;margin-right:4px}
.go{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:8px 14px;border-radius:99px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;text-decoration:none}
.go:active{background:var(--moss)}
.go.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.stay{margin:6px 0 12px;padding:12px 14px;border-radius:var(--r);background:var(--ink);color:#fff;font-size:14px}
.stay b{color:var(--saf)}
details{background:var(--card);border-radius:var(--r);margin:10px 0;padding:0 13px;box-shadow:0 1px 3px rgba(18,55,47,.12)}
summary{padding:13px 0;font-weight:700;color:var(--ink);cursor:pointer}
.bk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #edeee8}
.bk div{font-size:14px;min-width:0}.bk span{display:block;font-size:12px;color:var(--sub)}
.bk .go{margin:0;padding:6px 12px;white-space:nowrap}
.sec{font-family:"Noto Serif TC",serif;font-size:21px;color:var(--ink);margin:2px 2px 12px}
.box{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(18,55,47,.12)}
.box h3{font-size:15px;display:flex;gap:8px}
.box .w{font-size:13px;color:var(--lotus);font-weight:700;margin:2px 0}
.box p{font-size:13px;color:var(--sub);white-space:pre-line}
.warn{background:#FFF4DC;border-left:4px solid var(--saf);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid #dfe5dc;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:9px 0 8px;font:inherit;font-size:12px;color:var(--sub)}
.nav button span{display:block;font-size:22px;line-height:1.1}
.nav button.on{color:var(--lotus);font-weight:700}
.v{display:none}.v.on{display:block}
.foot{text-align:center;font-size:12px;color:var(--sub);margin:22px 0 6px}
</style>
</head>
<body>
<header class="hero">
  <h1>🐶 一起去旅行<br>柬埔寨・金邊 × 暹粒</h1>
  <p>2026/10/23（五）– 10/28（三）｜6 天 5 夜（含 2 晚夜巴）</p>
  <span class="cd" id="cd"></span>
  <svg viewBox="0 0 400 110" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <circle cx="200" cy="64" r="34" fill="#FFD27A" opacity=".9"/>
    <path d="M0 110V92h60v-8h8v-12h6v12h8v-6h10v6h6V80h8v12h28V70h6V54h6V42h6V30h5V42h5V54h6V70h6V58h6V42h6V28h6V14h5v14h6v14h6v16h6v12h6V70h6V54h6V42h5V30h5V42h5V54h6V70h6v22h28V80h8v12h6v-6h10v6h8V72h6v12h8v8h60v18z" fill="#12372F"/>
    <path d="M0 110v-8c40-6 80-4 130-2s90 4 140 0 80-4 130 2v8z" fill="#2F6B4F"/>
  </svg>
</header>

<div class="days" id="days"></div>
<main>
  <section class="v on" id="v-day"></section>
  <section class="v" id="v-trans"></section>
  <section class="v" id="v-stay"></section>
</main>

<nav class="nav">
  <button class="on" data-v="day"><span>🗓️</span>每日行程</button>
  <button data-v="trans"><span>🚌</span>交通</button>
  <button data-v="stay"><span>🏨</span>住宿</button>
</nav>

<script>

const ICON={fly:"✈️",food:"🍜",sight:"🏛️",move:"🚌",rest:"🛏️",night:"🍸",shop:"🛍️"};
// [時間, 類型, 標題, 地圖關鍵字, 備註, 標籤]

{d:"10/23",w:"五",n:"Day 1",t:"出發日＋金邊觀光",sum:"早班機抵達金邊，白天走歷史與皇宮，晚上河岸夜遊，23:58 搭夜巴去暹粒。",

 s:[

 ["18:00","move","包車結束，回市區","The Moon Residence & Spa Siem Reap","回飯店休息、洗澡。"],
